<!-- @dsCard height=272 -->
<style>
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.cover{position:relative;width:960px;height:272px;overflow:hidden;background:var(--bg)}
.cover svg{position:absolute;left:0;top:0;display:block}
.accent{fill:var(--accent)}
.ink{fill:var(--ink)}
.soft{fill:var(--accent-soft)}
.ok{fill:var(--success)}
.warn{fill:var(--warning)}
.cut{fill:var(--bg)}
.dim{opacity:.4}
.slab{rx:var(--radius-lg)}
.pill{rx:7px}
.name{position:absolute;left:32px;top:142px;margin:0;font:700 64px/.95 var(--font-sans);letter-spacing:-.025em;color:var(--ink);white-space:nowrap}
.tag{position:absolute;left:34px;top:218px;margin:0;font:14px/20px var(--font-sans);color:var(--ink-muted)}
</style>
<div class="cover">
<!--
Blocks: accent 420x132 slab bleeding off the top and left, ink 204x112, accent-soft 124x104, success 80x92 and warning 108x76 as small signal blocks, all with radius-lg corners.
Arrangement: one strip of unequal bands bleeding off the top edge, stepping down in height from left to right, with the warning block bleeding off the right.
Pattern: pills, because the system is soft and rounded and a row of pills reads as module progress, the thing CourseCapture tracks.
Steps and radii: 20px slab corners from radius-lg, 14px pills with a 28px width and 8px gap from space-2.
-->
<svg width="960" height="112" viewBox="0 0 960 112" role="img" aria-label="Rows of progress pills on blue, dark, pale blue, green and amber blocks">
  <rect class="accent slab" x="-20" y="-20" width="420" height="132"/>
  <rect class="ink slab" x="416" y="-20" width="204" height="112"/>
  <rect class="soft slab" x="636" y="-20" width="124" height="104"/>
  <rect class="ok slab" x="776" y="-20" width="80" height="92"/>
  <rect class="warn slab" x="872" y="-20" width="108" height="76"/>

  <rect class="cut pill" x="28" y="70" width="28" height="14"/>
  <rect class="cut pill" x="64" y="70" width="28" height="14"/>
  <rect class="cut pill" x="100" y="70" width="28" height="14"/>
  <rect class="cut pill" x="136" y="70" width="28" height="14"/>
  <rect class="cut pill" x="172" y="70" width="28" height="14"/>
  <rect class="cut pill" x="208" y="70" width="28" height="14"/>
  <rect class="cut pill dim" x="244" y="70" width="28" height="14"/>
  <rect class="cut pill dim" x="280" y="70" width="28" height="14"/>
  <rect class="cut pill dim" x="316" y="70" width="28" height="14"/>

  <rect class="accent pill" x="436" y="62" width="28" height="14"/>
  <rect class="accent pill" x="472" y="62" width="28" height="14"/>
  <rect class="accent pill" x="508" y="62" width="28" height="14"/>

  <rect class="accent pill" x="652" y="58" width="28" height="14"/>
  <rect class="accent pill" x="688" y="58" width="28" height="14"/>
</svg>
<h1 class="name">CourseCapture</h1>
<p class="tag">Soft, rounded screens for teachers and students.</p>
</div>
