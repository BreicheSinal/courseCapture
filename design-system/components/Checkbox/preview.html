<!-- @dsCard group="Forms" height=410 subtitle="Unchecked, checked, indeterminate, disabled and a group" -->
<style>
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.pv{display:flex;flex-direction:column;gap:20px;padding:24px;max-width:560px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.cap{font:12px/16px var(--font-sans);color:var(--ink-muted);margin:0 0 -10px}
</style>
<div class="pv">
  <p class="cap">States</p>
  <div class="row"><label class="cc-check"><input class="cc-check__input" type="checkbox" ><span class="cc-check__box"><svg class="cc-check__tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="cc-check__dash" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></span><span class="cc-check__text"><span>Unchecked</span></span></label><label class="cc-check"><input class="cc-check__input" type="checkbox" checked><span class="cc-check__box"><svg class="cc-check__tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="cc-check__dash" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></span><span class="cc-check__text"><span>Checked</span></span></label><label class="cc-check"><input class="cc-check__input" type="checkbox" checked aria-checked="mixed"><span class="cc-check__box"><svg class="cc-check__tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="cc-check__dash" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></span><span class="cc-check__text"><span>Some selected</span></span></label><label class="cc-check"><input class="cc-check__input" type="checkbox" disabled><span class="cc-check__box"><svg class="cc-check__tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="cc-check__dash" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></span><span class="cc-check__text"><span>Disabled</span></span></label><label class="cc-check"><input class="cc-check__input" type="checkbox" checked disabled><span class="cc-check__box"><svg class="cc-check__tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="cc-check__dash" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></span><span class="cc-check__text"><span>Disabled, checked</span></span></label></div>
  <p class="cap">Group</p>
  <fieldset class="cc-group"><legend>Quiz options</legend><label class="cc-check"><input class="cc-check__input" type="checkbox" checked><span class="cc-check__box"><svg class="cc-check__tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="cc-check__dash" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></span><span class="cc-check__text"><span>Shuffle questions</span></span></label><label class="cc-check"><input class="cc-check__input" type="checkbox" ><span class="cc-check__box"><svg class="cc-check__tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="cc-check__dash" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></span><span class="cc-check__text"><span>Show correct answers after submitting</span><span class="cc-check__hint">Students see the answer and a short explanation.</span></span></label><label class="cc-check"><input class="cc-check__input" type="checkbox" ><span class="cc-check__box"><svg class="cc-check__tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="cc-check__dash" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></span><span class="cc-check__text"><span>Allow a second attempt</span></span></label></fieldset>
  <p class="cap">Acknowledgment</p>
  <label class="cc-check"><input class="cc-check__input" type="checkbox" ><span class="cc-check__box"><svg class="cc-check__tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="cc-check__dash" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></span><span class="cc-check__text"><span>I have read this course and it is ready to assign.</span></span></label>
</div>
