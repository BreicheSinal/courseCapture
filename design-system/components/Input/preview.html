<!-- @dsCard group="Forms" height=778 subtitle="Sizes, prefix and suffix, helper, error and disabled" -->
<style>
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.pv{display:flex;flex-direction:column;gap:20px;padding:24px;max-width:560px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.cap{font:12px/16px var(--font-sans);color:var(--ink-muted);margin:0 0 -10px}
</style>
<div class="pv" style="max-width:420px">
  <p class="cap">Sizes</p>
  <input class="cc-input cc-input--sm" aria-label="Small" placeholder="Small" >
  <input class="cc-input" aria-label="Medium" placeholder="Medium">
  <input class="cc-input cc-input--lg" aria-label="Large" placeholder="Large">
  <p class="cap">Prefix and suffix</p>
  <div class="cc-field">
    <label class="cc-field__label" for="i1">Course link</label>
    <div class="cc-inputbox"><span class="cc-inputbox__affix">https://</span><input class="cc-input" id="i1" placeholder="coursecapture.app/biology"></div>
  </div>
  <div class="cc-field">
    <label class="cc-field__label" for="i2">Quiz time limit</label>
    <div class="cc-inputbox"><input class="cc-input" id="i2" inputmode="numeric" value="20" aria-describedby="i2h"><span class="cc-inputbox__affix">min</span></div>
    <span class="cc-field__hint" id="i2h">Students see a timer during the quiz.</span>
  </div>
  <p class="cap">Error</p>
  <div class="cc-field is-error">
    <label class="cc-field__label" for="i3">Join code</label>
    <div class="cc-inputbox"><input class="cc-input" id="i3" value="K7M" aria-invalid="true" aria-describedby="i3e"></div>
    <span class="cc-field__error" id="i3e">Enter a five-character code.</span>
  </div>
  <p class="cap">Disabled</p>
  <div class="cc-field">
    <label class="cc-field__label" for="i4">Class</label>
    <input class="cc-input" id="i4" value="Biology 101" disabled aria-describedby="i4h">
    <span class="cc-field__hint" id="i4h">The class is set by the course.</span>
  </div>
</div>
